version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: leadvault-backend
    ports:
      - "8000:8000"
    environment:
      - LEADVAULT_ENV=production
      - LEADVAULT_LLM_PROVIDER=null
      - LEADVAULT_LLM_VALIDATION=0
      - LEADVAULT_RUNTIME_DIR=/app/backend/runtime
    volumes:
      - leadvault_runtime:/app/backend/runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/leadvault/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: leadvault-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_LEADVAULT_API=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  leadvault_runtime:
    driver: local
