name: LeadVault CI & Regression Gates

on:
  push:
    branches: [main, codex/leadvault-launch]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite & Adversarial Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Suite (Unit + Adversarial + Governance)
        run: |
          python -m pytest backend/tests -v --cov=backend

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Check
        working-directory: frontend
        run: npm run typecheck

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
